<title>Produk Kedai Media</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #1e1b4b, #020617);
  color: white;
  text-align: center;
}

/* HEADER */
.header {
  padding: 40px 20px 10px;
}

.header h1 {
  font-size: 28px;
  background: linear-gradient(90deg, #22c55e, #3b82f6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.header p {
  opacity: 0.7;
  margin-top: 10px;
}

/* GRID */
.container {
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 18px;
  margin-top: 20px;
}

/* CARD */
.card {
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  text-decoration: none;
  color: white;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  transition: 0.3s;
  border: 1px solid rgba(255,255,255,0.1);
}

/* BORDER GLOW */
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 18px;
  padding: 1px;
  background: linear-gradient(45deg, #22c55e, #3b82f6, #a855f7);
  -webkit-mask: 
    linear-gradient(#fff 0 0) content-box, 
    linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
}

.card:hover {
  transform: translateY(-6px) scale(1.03);
}

/* IMAGE */
.card img {
  width: 100%;
  height: 120px;
  object-fit: cover;
}

/* TITLE */
.card h3 {
  padding: 12px;
  font-size: 14px;
}

/* BADGE */
.badge {
  position: absolute;
  top: 10px;
  left: 10px;
  background: #22c55e;
  font-size: 10px;
  padding: 5px 8px;
  border-radius: 6px;
}

/* FOOTER */
.footer {
  margin: 30px 0;
  font-size: 12px;
  opacity: 0.5;
}
</style>


<!-- Floating WhatsApp CSS -->
<style>
.km-wa-float{
  position:fixed;
  bottom:20px;
  right:20px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:48px;
  height:48px;
  background:#25D366;
  color:#ffffff !important;
  border-radius:50%;
  box-shadow:0 6px 18px rgba(37,211,102,.45),0 3px 8px rgba(0,0,0,.15);
  z-index:9999;
  text-decoration:none !important;
  transition:transform .2s ease,background .2s ease,box-shadow .2s ease;
  line-height:0;
}
.km-wa-float::before{
  content:"";
  position:absolute;
  inset:-3px;
  border-radius:50%;
  border:2px solid #25D366;
  opacity:.5;
  animation:kmWaPulse 2.2s ease-out infinite;
  pointer-events:none;
}
.km-wa-float:hover{
  background:#1da851;
  transform:scale(1.08);
  box-shadow:0 8px 22px rgba(37,211,102,.55),0 4px 10px rgba(0,0,0,.2);
}
.km-wa-float svg{
  width:26px;
  height:26px;
  flex-shrink:0;
  position:relative;
  z-index:1;
}
@keyframes kmWaPulse{
  0%{transform:scale(1);opacity:.5}
  70%{transform:scale(1.35);opacity:0}
  100%{transform:scale(1.45);opacity:0}
}
@media (max-width:640px){
  .km-wa-float{bottom:16px;right:16px;width:44px;height:44px}
  .km-wa-float svg{width:24px;height:24px}
}
</style>
